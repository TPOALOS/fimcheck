[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fimcheck"
version = "1.1.0"
description = "File integrity monitor: SHA-256 baseline, change report incl. permissions and owner, JSON output."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["file-integrity-monitoring", "integrity", "sha256", "blue-team"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/fimcheck"

[project.scripts]
fimcheck = "fimcheck:main"

[tool.setuptools]
py-modules = ["fimcheck"]
